name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python (model + schema)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: install
        run: pip install -e ".[dev]"
      - name: pytest
        run: pytest
      - name: JSON Schema ドリフト検知（生成物 schema/ がモデルと一致するか）
        run: videoscore-gen-schema --out-dir ../schema --check

  typescript:
    name: TypeScript (generated types)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: enable pnpm (corepack, packageManager 準拠)
        run: corepack enable
      - name: install
        run: pnpm install --no-frozen-lockfile
      - name: TS 型ドリフト検知（src/*.gen.ts が schema/ と一致するか）
        run: pnpm gen:check
      - name: build
        run: pnpm build

  remotion:
    name: Remotion player (typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: remotion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: enable pnpm (corepack, packageManager 準拠)
        run: corepack enable
      - name: install
        run: pnpm install --no-frozen-lockfile
      - name: typecheck（videoscore 型は ../typescript/src を paths で参照）
        run: pnpm typecheck
